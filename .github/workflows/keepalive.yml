name: keep-supabase-awake
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://lfzdlackuqyhvkyvnmbl.supabase.co/rest/v1/maps?select=id&limit=1" -H "apikey: sb_publishable_grQYZDEQeLVTHv0sVAXj1w_zhc2pOkf")
          echo "Supabase responded: $code"
          test "$code" -lt 500
